<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <!-- Cyberpunk purple-to-cyan gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bc13fe" />
      <stop offset="100%" stop-color="#00f3ff" />
    </linearGradient>
    
    <!-- Neon blur glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark theme rounded background box with glowing border -->
  <rect x="2" y="2" width="44" height="44" rx="10" fill="#050a14" stroke="url(#neonGrad)" stroke-width="2.5" />
  
  <!-- Left Bracket '<' in cyan glow -->
  <path d="M 16 15 L 6 24 L 16 33" stroke="#00f3ff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Right Bracket '>' in purple glow -->
  <path d="M 32 15 L 42 24 L 32 33" stroke="#bc13fe" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Center Slash '/' in mixed gradient glow -->
  <path d="M 27.5 10 L 20.5 38" stroke="url(#neonGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>
</svg>